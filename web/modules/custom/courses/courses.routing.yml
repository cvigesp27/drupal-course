courses.delete:
  path: '/courses/{node}/delete'
  defaults:
    _form: '\Drupal\courses\Form\CoursesDeleteForm'
    _title: 'Delete course'
  requirements:
    _entity_access: 'node.delete'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
  